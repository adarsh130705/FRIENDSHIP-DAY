<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Friendship Day ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

background:linear-gradient(135deg,#0f172a,#1e3a8a,#9333ea);
overflow:hidden;
height:100vh;
display:flex;
justify-content:center;
align-items:center;

}

.container{

width:90%;
max-width:400px;
background:rgba(255,255,255,.1);
backdrop-filter:blur(15px);
padding:25px;
border-radius:20px;
text-align:center;
color:white;
box-shadow:0 0 30px rgba(255,255,255,.2);

}

.photo{

width:220px;
height:220px;
border-radius:50%;
object-fit:cover;
border:6px solid white;
box-shadow:0 0 25px hotpink;
animation:zoom 4s infinite alternate;

}

@keyframes zoom{

from{
transform:scale(1);
}

to{
transform:scale(1.08);
}

}

h1{

margin-top:20px;
font-size:32px;
animation:glow 2s infinite;

}

@keyframes glow{

50%{
text-shadow:0 0 20px gold;
}

}

#msg{

margin-top:20px;
font-size:20px;
min-height:120px;
line-height:32px;

}

.heart{

position:absolute;
font-size:25px;
animation:float 7s linear infinite;

}

@keyframes float{

0%{
transform:translateY(100vh);
opacity:1;
}

100%{

transform:translateY(-120px);
opacity:0;

}

}

.confetti{

position:absolute;
width:10px;
height:10px;
animation:fall linear forwards;

}

@keyframes fall{

0%{
transform:translateY(-20px) rotate(0deg);
}

100%{

transform:translateY(110vh) rotate(720deg);

}

}

.footer{

margin-top:20px;
font-size:18px;
color:#ffd700;

}

</style>

</head>

<body>

<div class="container">

<img src="friend.jpg" class="photo">

<h1>❤️ Happy Friendship Day ❤️</h1>

<div id="msg"></div>

<div class="footer">

Forever Friends 🤝

</div>

</div>

<script>

const text="True friends are never apart... Maybe in distance, but never in heart. Wishing you a Happy Friendship Day! ❤️";

let i=0;

function typing(){

if(i<text.length){

document.getElementById("msg").innerHTML+=text.charAt(i);

i++;

setTimeout(typing,50);

}

}

typing();

function heart(){

let h=document.createElement("div");

h.innerHTML="❤️";

h.className="heart";

h.style.left=Math.random()*100+"vw";

h.style.fontSize=(20+Math.random()*30)+"px";

h.style.animationDuration=(4+Math.random()*4)+"s";

document.body.appendChild(h);

setTimeout(()=>{

h.remove();

},7000);

}

setInterval(heart,300);

const colors=["red","yellow","cyan","pink","lime","orange","white"];

function confetti(){

for(let i=0;i<120;i++){

let c=document.createElement("div");

c.className="confetti";

c.style.left=Math.random()*100+"vw";

c.style.background=colors[Math.floor(Math.random()*colors.length)];

c.style.animationDuration=(3+Math.random()*4)+"s";

document.body.appendChild(c);

setTimeout(()=>{

c.remove();

},7000);

}

}

setTimeout(confetti,1000);

</script>

</body>
</html>
